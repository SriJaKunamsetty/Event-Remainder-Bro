name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Production dependencies only. A high-severity advisory with no patched release currently
      # affects dev-only lint tooling (braces via eslint-config-next); it never ships to users.
      - run: npm audit --omit=dev --audit-level=high
